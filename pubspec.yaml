name: axiom
description: A modern, private messaging app
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.2.0
  sdp_transform: ^0.3.0
  web_socket_channel: ^3.0.0
  # UI & Animations
  cupertino_icons: ^1.0.8
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  
  # State & Backend
  provider: ^6.1.2
  supabase_flutter: ^2.8.1
  
  # Utilities
  image_picker: ^1.1.2
  intl: ^0.19.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/